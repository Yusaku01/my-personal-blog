name: 'Scheduled Build'

on:
  schedule:
    - cron: '0 */12 * * *' # 12時間ごとに実行
  push:
    branches: [main]
    paths:
      - 'src/content/**'
      - 'scripts/build-ogp.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/scheduled-build.yml'
  workflow_dispatch: {} # 手動トリガーも許可

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.x'
  # Cloudflare Pages向けのプロジェクト名（例: "my-personal-blog"）
  CF_PAGES_PROJECT_NAME: ${{ vars.CF_PAGES_PROJECT_NAME || '' }}
  # Secretsはif句で直接参照できない環境での評価エラー回避のためenvに流す
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (fetch external content + ogp)
        run: pnpm run build:with-ogp

      - name: Deploy to Cloudflare Pages
        if: env.CF_PAGES_PROJECT_NAME != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ env.CF_PAGES_PROJECT_NAME }}
          directory: dist
